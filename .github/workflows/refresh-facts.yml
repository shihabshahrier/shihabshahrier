name: Refresh README facts

# Once a week, reads LetX's public statistics and updates the figures in README.md.
# Needs no secret: the statistics are public and the default token can commit to this repository.

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC (09:17 in Dhaka)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-facts
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh figures
        run: python scripts/refresh_facts.py
      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain README.md)" ]]; then
            echo "README unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh LetX figures"
          git push
